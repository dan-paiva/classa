name: classa

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: classa
      POSTGRES_PASSWORD: classa
      POSTGRES_DB: classa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classa"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
